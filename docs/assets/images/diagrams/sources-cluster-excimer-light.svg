<title id="t">Excimer &amp; lamp lines</title>
<desc id="d">Two lanes to a top-hat pupil of sigma 0.7: a pulsed Kr/Ar/F2 discharge forms the excimer, a prism-and-grating module narrows the line to the E95 bandwidth and a silica or CaF2 lens follows; an Hg arc lamp and an interference filter isolate the g, h or i line.</desc>
