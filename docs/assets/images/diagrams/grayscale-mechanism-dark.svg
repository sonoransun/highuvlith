<title id="t">Grayscale lithography: transmittance → dose → contrast curve → height</title>
<desc id="d">Four panels in a row: a continuous-tone mask transmittance T(x), the band-limited local dose D(x) it images to, the log-linear contrast curve rising from D_th to D_clear with slope γ, and the resulting blazed resist relief h = T_r·(1 − f(D)) on its substrate.</desc>
