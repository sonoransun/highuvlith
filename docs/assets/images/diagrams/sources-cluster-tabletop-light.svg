<title id="t">Table-top coherent EUV</title>
<desc id="d">Two lanes to coherent-core pupils: a femtosecond driver in a Ne or Ar jet drives the three-step process that emits an odd-harmonic comb up to Ip plus 3.17 Up; a capillary discharge or picosecond laser pumps a plasma column that lases by amplified spontaneous emission on a fixed atomic line.</desc>
