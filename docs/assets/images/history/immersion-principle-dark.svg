<title id="t">Why water immersion raises the numerical aperture</title>
<desc id="d">Two panels of the last lens element above a wafer: in air a steep ray is totally internally reflected at the glass face because n sin theta cannot exceed 1, so NA stays below 1; with water (n about 1.44 at 193 nm) in the gap the same ray reaches the wafer and NA = n sin theta can reach about 1.35.</desc>
