<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Pitch splitting: LELE versus SADP</title>
<desc id="d">Top row, litho-etch-litho-etch: a first exposure and etch print every other line at pitch P, a second exposure shifted by P/2 prints the lines in between, giving pitch P/2 but making the result depend on overlay between the two exposures. Bottom row, self-aligned double patterning: one exposure prints mandrels at pitch P; a conformal film is deposited and etched back so that spacers remain on the mandrel sidewalls; removing the mandrels leaves spacers at pitch P/2, with widths set by deposition.</desc>
