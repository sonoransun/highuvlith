<title id="t">What had to change at 248 nm</title>
<desc id="d">A four-column before-and-after strip for the move to 248 nm: light source from a mercury lamp to a KrF excimer laser, lens glass from BK7 and quartz to fused silica with calcium fluoride, resist from DNQ-novolac to chemically amplified, and masks from plain chrome to chrome with OPC and phase shift.</desc>
<defs><marker id="arr-5b36c9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b36c9"/></marker></defs>
<text x="16" y="22" font-size="12.5" text-anchor="start" fill="#52514e" font-weight="600" letter-spacing="0.6">MERCURY LAMP → KRF 248 NM: WHAT HAD TO CHANGE AT ONCE</text>
<text x="126" y="54" font-size="15" text-anchor="middle" fill="#0b0b0b" font-weight="700">Light source</text>
<rect x="18" y="82" width="216" height="24" rx="5" fill="#ededed" stroke="#c3c2b7" stroke-width="0.9"/>
<text x="126" y="98.5" font-size="13" text-anchor="middle" fill="#52514e" font-weight="400">mercury lamp</text>
<line x1="126" y1="108" x2="126" y2="125" stroke="#5b36c9" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-5b36c9)"/>
<rect x="18" y="128" width="216" height="24" rx="5" fill="#e8e3f7" stroke="#5b36c9" stroke-width="1"/>
<text x="126" y="144.5" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="600">KrF excimer laser</text>
<text x="126" y="174" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">A lamp emits ~1/30 as much at 248 nm</text>
<text x="126" y="189" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">as in its other UV bands; the laser</text>
<text x="126" y="204" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">is line-narrowed to picometres.</text>
<text x="126" y="221" font-size="12.5" text-anchor="middle" fill="#6b6a65" font-weight="400">[2, 3, 8]</text>
<line x1="244" y1="40" x2="244" y2="232" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="362" y="54" font-size="15" text-anchor="middle" fill="#0b0b0b" font-weight="700">Lens glass</text>
<rect x="254" y="82" width="216" height="24" rx="5" fill="#ededed" stroke="#c3c2b7" stroke-width="0.9"/>
<text x="362" y="98.5" font-size="13" text-anchor="middle" fill="#52514e" font-weight="400">BK7, quartz</text>
<line x1="362" y1="108" x2="362" y2="125" stroke="#5b36c9" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-5b36c9)"/>
<rect x="254" y="128" width="216" height="24" rx="5" fill="#e8e3f7" stroke="#5b36c9" stroke-width="1"/>
<text x="362" y="144.5" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="600">fused silica + CaF₂</text>
<text x="362" y="174" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">Below 300 nm ordinary glass absorbs:</text>
<text x="362" y="189" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">every element had to be fused silica,</text>
<text x="362" y="204" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">with CaF₂ for colour correction.</text>
<text x="362" y="221" font-size="12.5" text-anchor="middle" fill="#6b6a65" font-weight="400">[1]</text>
<line x1="480" y1="40" x2="480" y2="232" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="598" y="54" font-size="15" text-anchor="middle" fill="#0b0b0b" font-weight="700">Resist</text>
<rect x="490" y="82" width="216" height="24" rx="5" fill="#ededed" stroke="#c3c2b7" stroke-width="0.9"/>
<text x="598" y="98.5" font-size="13" text-anchor="middle" fill="#52514e" font-weight="400">DNQ / novolac</text>
<line x1="598" y1="108" x2="598" y2="125" stroke="#5b36c9" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-5b36c9)"/>
<rect x="490" y="128" width="216" height="24" rx="5" fill="#e8e3f7" stroke="#5b36c9" stroke-width="1"/>
<text x="598" y="144.5" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="600">chemically amplified</text>
<text x="598" y="174" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">DNQ/novolac absorbs too strongly at</text>
<text x="598" y="189" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">248 nm; one photon releases an acid</text>
<text x="598" y="204" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">that catalyses many reactions.</text>
<text x="598" y="221" font-size="12.5" text-anchor="middle" fill="#6b6a65" font-weight="400">[2, 10, 17]</text>
<line x1="716" y1="40" x2="716" y2="232" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="834" y="54" font-size="15" text-anchor="middle" fill="#0b0b0b" font-weight="700">Mask</text>
<rect x="726" y="82" width="216" height="24" rx="5" fill="#ededed" stroke="#c3c2b7" stroke-width="0.9"/>
<text x="834" y="98.5" font-size="13" text-anchor="middle" fill="#52514e" font-weight="400">chrome on quartz</text>
<line x1="834" y1="108" x2="834" y2="125" stroke="#5b36c9" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-5b36c9)"/>
<rect x="726" y="128" width="216" height="24" rx="5" fill="#e8e3f7" stroke="#5b36c9" stroke-width="1"/>
<text x="834" y="144.5" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="600">chrome + OPC, PSM</text>
<text x="834" y="174" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">Near the limit the print no longer</text>
<text x="834" y="189" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">follows the mask: phase shift (1982)</text>
<text x="834" y="204" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="400">and OPC pre-distort it.</text>
<text x="834" y="221" font-size="12.5" text-anchor="middle" fill="#6b6a65" font-weight="400">[3, 15, 16]</text>
<text x="952" y="244" font-size="12.5" text-anchor="end" fill="#6b6a65" font-weight="400">Before (grey) → after (violet). Qualitative; [n] = reference on this page.</text>
</svg>
