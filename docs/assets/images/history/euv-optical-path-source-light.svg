<title id="t">EUV scanner light path</title>
<desc id="d">Schematic EUV scanner: a CO2 laser hits tin droplets, an ellipsoidal collector focuses the 13.5 nm light to an intermediate focus, facet mirrors shape it onto a reflective mask at oblique incidence, and six projection mirrors demagnify the pattern four times onto the wafer, all in vacuum.</desc>
