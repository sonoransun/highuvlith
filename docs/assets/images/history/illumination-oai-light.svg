<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Illumination shapes and why off-axis illumination helps</title>
<desc id="d">Top: four illumination shapes seen in the projection-lens pupil: conventional disc, annular ring, dipole and quadrupole. Bottom: for a dense grating whose first diffraction orders fall outside the pupil, on-axis light passes only the zero order and no pattern is imaged; tilting the illumination puts the zero order and one first order inside the pupil, and their interference images the grating.</desc>
<defs></defs>
<text x="20.0" y="34.0" font-size="17.9" text-anchor="start" fill="#1d1c1a" font-weight="bold">Illumination shapes (pupil view; circle = lens NA)</text>
<circle cx="110.0" cy="125.0" r="62.0" fill="none" stroke="#52514e" stroke-width="1.5"/>
<circle cx="110.0" cy="125.0" r="37.2" fill="#5b36c9" fill-opacity="0.55" stroke="none" stroke-width="1.5"/>
<line x1="42.0" y1="125.0" x2="178.0" y2="125.0" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<line x1="110.0" y1="57.0" x2="110.0" y2="193.0" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="110.0" y="212.0" font-size="15.7" text-anchor="middle" fill="#52514e" font-weight="normal">conventional</text>
<circle cx="330.0" cy="125.0" r="62.0" fill="none" stroke="#52514e" stroke-width="1.5"/>
<path d="M277.3,125 A52.699999999999996,52.699999999999996 0 1,0 382.7,125 A52.699999999999996,52.699999999999996 0 1,0 277.3,125 Z M295.9,125 A34.1,34.1 0 1,1 364.1,125 A34.1,34.1 0 1,1 295.9,125 Z" fill="#5b36c9" fill-opacity="0.55" stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="262.0" y1="125.0" x2="398.0" y2="125.0" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<line x1="330.0" y1="57.0" x2="330.0" y2="193.0" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="330.0" y="212.0" font-size="15.7" text-anchor="middle" fill="#52514e" font-weight="normal">annular</text>
<circle cx="550.0" cy="125.0" r="62.0" fill="none" stroke="#52514e" stroke-width="1.5"/>
<circle cx="511.6" cy="125.0" r="13.6" fill="#5b36c9" fill-opacity="0.55" stroke="none" stroke-width="1.5"/>
<circle cx="588.4" cy="125.0" r="13.6" fill="#5b36c9" fill-opacity="0.55" stroke="none" stroke-width="1.5"/>
<line x1="482.0" y1="125.0" x2="618.0" y2="125.0" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<line x1="550.0" y1="57.0" x2="550.0" y2="193.0" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="550.0" y="212.0" font-size="15.7" text-anchor="middle" fill="#52514e" font-weight="normal">dipole</text>
<circle cx="770.0" cy="125.0" r="62.0" fill="none" stroke="#52514e" stroke-width="1.5"/>
<circle cx="797.2" cy="152.2" r="12.4" fill="#5b36c9" fill-opacity="0.55" stroke="none" stroke-width="1.5"/>
<circle cx="742.8" cy="152.2" r="12.4" fill="#5b36c9" fill-opacity="0.55" stroke="none" stroke-width="1.5"/>
<circle cx="742.8" cy="97.8" r="12.4" fill="#5b36c9" fill-opacity="0.55" stroke="none" stroke-width="1.5"/>
<circle cx="797.2" cy="97.8" r="12.4" fill="#5b36c9" fill-opacity="0.55" stroke="none" stroke-width="1.5"/>
<line x1="702.0" y1="125.0" x2="838.0" y2="125.0" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<line x1="770.0" y1="57.0" x2="770.0" y2="193.0" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="770.0" y="212.0" font-size="15.7" text-anchor="middle" fill="#52514e" font-weight="normal">quadrupole</text>
<text x="20.0" y="264.0" font-size="17.9" text-anchor="start" fill="#1d1c1a" font-weight="bold">A dense grating: which diffraction orders get through the pupil?</text>
<circle cx="230.0" cy="368.0" r="62.0" fill="none" stroke="#52514e" stroke-width="1.5"/>
<circle cx="149.4" cy="368.0" r="7.0" fill="none" stroke="#6b6a66" stroke-width="1.8"/>
<text x="149.4" y="354.0" font-size="14.6" text-anchor="middle" fill="#6b6a66" font-weight="normal">−1</text>
<circle cx="230.0" cy="368.0" r="7.0" fill="#5b36c9" stroke="#5b36c9" stroke-width="1.8"/>
<text x="230.0" y="354.0" font-size="14.6" text-anchor="middle" fill="#1d1c1a" font-weight="normal">0</text>
<circle cx="310.6" cy="368.0" r="7.0" fill="none" stroke="#6b6a66" stroke-width="1.8"/>
<text x="310.6" y="354.0" font-size="14.6" text-anchor="middle" fill="#6b6a66" font-weight="normal">+1</text>
<text x="230.0" y="454.0" font-size="15.7" text-anchor="middle" fill="#52514e" font-weight="normal">on-axis illumination</text>
<text x="230.0" y="472.0" font-size="14.6" text-anchor="middle" fill="#eb6834" font-weight="normal">only the 0 order passes: no image</text>
<circle cx="650.0" cy="368.0" r="62.0" fill="none" stroke="#52514e" stroke-width="1.5"/>
<circle cx="529.1" cy="368.0" r="7.0" fill="none" stroke="#6b6a66" stroke-width="1.8"/>
<text x="529.1" y="354.0" font-size="14.6" text-anchor="middle" fill="#6b6a66" font-weight="normal">−1</text>
<circle cx="609.7" cy="368.0" r="7.0" fill="#5b36c9" stroke="#5b36c9" stroke-width="1.8"/>
<text x="609.7" y="354.0" font-size="14.6" text-anchor="middle" fill="#1d1c1a" font-weight="normal">0</text>
<circle cx="690.3" cy="368.0" r="7.0" fill="#5b36c9" stroke="#5b36c9" stroke-width="1.8"/>
<text x="690.3" y="354.0" font-size="14.6" text-anchor="middle" fill="#1d1c1a" font-weight="normal">+1</text>
<text x="650.0" y="454.0" font-size="15.7" text-anchor="middle" fill="#52514e" font-weight="normal">off-axis (dipole pole)</text>
<text x="650.0" y="472.0" font-size="14.6" text-anchor="middle" fill="#52514e" font-weight="normal">0 and +1 pass: two-beam interference</text>
<text x="876.0" y="494.0" font-size="12.3" text-anchor="end" fill="#6b6a66" font-weight="normal">Order spacing = λ/(pitch) in pupil units; filled = transmitted, open = blocked.</text>
</svg>
