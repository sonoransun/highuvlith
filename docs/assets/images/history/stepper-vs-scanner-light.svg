<title id="t">Stepper versus scanner</title>
<desc id="d">Left, a step-and-repeat stepper: the whole reticle is lit in one flash, one field printed, the wafer stepped to the next. Right, a step-and-scan system: a slit of light sweeps the reticle while reticle and wafer scan in opposite directions, the reticle four times faster for a 4x lens.</desc>
