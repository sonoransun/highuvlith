<title id="t">Two lanes to the planar integrated circuit</title>
<desc id="d">Two timeline lanes joined by an arrow: printing and photography from Senefelder's 1796 lithography through Niépce's 1827 bitumen image to Poitevin's 1855 carbon process, and silicon from the 1955 oxide mask through 1957 photoresist patterning to the first planar integrated circuit in 1960.</desc>
