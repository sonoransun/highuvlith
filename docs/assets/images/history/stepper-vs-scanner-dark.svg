<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Stepper versus scanner</title>
<desc id="d">Left: a step-and-repeat stepper illuminates the whole reticle field at once, prints one field on the wafer, then steps the wafer to the next field. Right: a step-and-scan system illuminates only a slit; reticle and wafer scan through it in opposite directions, the reticle four times faster for a 4x lens, so a lens corrected over the slit alone prints a large field.</desc>
