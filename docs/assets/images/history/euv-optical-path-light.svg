<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">EUV scanner light path</title>
<desc id="d">Schematic of an EUV exposure tool. A CO2 laser pulse hits a tin droplet; the plasma emits 13.5 nm light that an ellipsoidal collector mirror focuses to an intermediate focus. Faceted illuminator mirrors shape the beam and send it to a reflective mask at oblique incidence; six projection mirrors demagnify the mask pattern four times onto the wafer. Every optic is a multilayer mirror and the whole path is kept in vacuum.</desc>
