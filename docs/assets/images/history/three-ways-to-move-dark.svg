<title id="t">Three ways to move the image</title>
<desc id="d">Three panels: the Micralign 1:1 scanning projection aligner with an Offner two-mirror relay, an arc slit and a carriage moving mask and wafer together; a step-and-repeat stepper lighting a whole reticle field; a step-and-scan system sweeping a slit while reticle and wafer scan oppositely.</desc>
