<title id="t">Energy-recovery linac (ERL) driven free-electron laser</title>
<desc id="d">An injector feeds a superconducting linac through a merger; the accelerated beam is turned by an arc into a long undulator that emits EUV to the scanners, a return arc brings the spent beam back half an RF period late so the linac decelerates it and recovers its energy before a low-energy beam dump.</desc>
