<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">Energy-recovery linac (ERL) driven free-electron laser</title><desc id="d">An electron injector feeds a superconducting linac through a merger. The beam is accelerated, turned by an arc, and lased in a long undulator that emits EUV. A return arc brings the spent beam back to the linac half an RF period late, so it is decelerated and hands its energy back to the RF field before going to a low-energy beam dump.</desc><defs><marker id="arr6aa6ee" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6aa6ee"/></marker><marker id="arr22d3ee" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker></defs><rect x="300.0" y="344.0" width="330.0" height="52.0" rx="10" fill="#1f3552" stroke="#6aa6ee" stroke-width="1.5"/><ellipse cx="330.0" cy="370.0" rx="14.0" ry="18.0" fill="none" stroke="#6aa6ee" stroke-width="1.2"/><ellipse cx="371.0" cy="370.0" rx="14.0" ry="18.0" fill="none" stroke="#6aa6ee" stroke-width="1.2"/><ellipse cx="412.0" cy="370.0" rx="14.0" ry="18.0" fill="none" stroke="#6aa6ee" stroke-width="1.2"/><ellipse cx="453.0" cy="370.0" rx="14.0" ry="18.0" fill="none" stroke="#6aa6ee" stroke-width="1.2"/><ellipse cx="494.0" cy="370.0" rx="14.0" ry="18.0" fill="none" stroke="#6aa6ee" stroke-width="1.2"/><ellipse cx="535.0" cy="370.0" rx="14.0" ry="18.0" fill="none" stroke="#6aa6ee" stroke-width="1.2"/><ellipse cx="576.0" cy="370.0" rx="14.0" ry="18.0" fill="none" stroke="#6aa6ee" stroke-width="1.2"/><ellipse cx="617.0" cy="370.0" rx="14.0" ry="18.0" fill="none" stroke="#6aa6ee" stroke-width="1.2"/><text x="470.0" y="318.0" font-size="16.2" text-anchor="middle" fill="#f1f0ee" font-weight="normal"><tspan x="470.0" dy="0.0">superconducting linac: accelerates on pass 1,</tspan><tspan x="470.0" dy="20.2">decelerates on pass 2</tspan></text><rect x="40.0" y="416.0" width="100.0" height="40.0" rx="6" fill="#2a2834" stroke="#c3c2b7" stroke-width="1.2"/><text x="90.0" y="441.0" font-size="16.9" text-anchor="middle" fill="#f1f0ee" font-weight="normal">injector</text><path d="M140,436 C200,436 240,376 300,376" stroke="#6aa6ee" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr6aa6ee)"/><text x="218.0" y="432.0" font-size="15.0" text-anchor="start" fill="#c3c2b7" font-weight="normal">merger</text><line x1="630.0" y1="364.0" x2="760.0" y2="364.0" stroke="#6aa6ee" stroke-width="2.5" stroke-linecap="round"/><path d="M760,364 A112.0,112.0 0 0 0 760,140" stroke="#6aa6ee" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="760.0" y1="140.0" x2="250.0" y2="140.0" stroke="#6aa6ee" stroke-width="2.5" stroke-linecap="round"/><path d="M250,140 A112.0,112.0 0 0 0 250,364" stroke="#6aa6ee" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="250.0" y1="364.0" x2="300.0" y2="364.0" stroke="#6aa6ee" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr6aa6ee)"/><line x1="700.0" y1="140.0" x2="670.0" y2="140.0" stroke="#6aa6ee" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr6aa6ee)"/><text x="746.0" y="234.0" font-size="15.6" text-anchor="end" fill="#c3c2b7" font-weight="normal">arc</text><text x="264.0" y="226.0" font-size="15.6" text-anchor="start" fill="#c3c2b7" font-weight="normal"><tspan x="264.0" dy="0.0">return arc:</tspan><tspan x="264.0" dy="19.5">arrives ½ RF period late</tspan></text><rect x="330.0" y="123.0" width="14.4" height="9.0" rx="0.0" fill="#a3a29b" stroke="none" stroke-width="1.5"/><rect x="330.0" y="148.0" width="14.4" height="9.0" rx="0.0" fill="#4a4852" stroke="none" stroke-width="1.5"/>