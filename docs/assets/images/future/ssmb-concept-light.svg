<title id="t">Steady-state microbunching (SSMB) storage-ring concept</title>
<desc id="d">A phase-locked laser co-propagates with the electrons through a modulator undulator and imprints an energy modulation; the ring lattice turns it into microbunches at a radiator undulator that emits coherent EUV at a laser harmonic on every turn; inset: microbunches spaced by the laser wavelength.</desc>
