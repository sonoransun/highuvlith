<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">Steady-state microbunching (SSMB) storage-ring concept</title><desc id="d">A racetrack storage ring. In the lower straight a phase-locked laser, steered onto the beam axis by a mirror, co-propagates with the electrons through a modulator undulator and imprints an energy modulation at the laser wavelength. The ring lattice turns that energy modulation into density microbunches, much shorter than the laser wavelength, at a radiator undulator in the upper straight, where the beam radiates coherently at a harmonic of the laser; the lattice then undoes and re-forms the bunching on every turn. An RF cavity replaces the radiated energy. An inset shows electron density versus position with sharp microbunches spaced by the laser wavelength.</desc><defs><marker id="arr2a78d6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arr0e7490" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs><path d="M190,380 L590,380 A120,120 0 0 0 590,140 L190,140 A120,120 0 0 0 190,380 Z" stroke="#2a78d6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="250.0" y1="380.0" x2="280.0" y2="380.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" marker-end="url(#arr2a78d6)"/><line x1="560.0" y1="140.0" x2="530.0" y2="140.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" marker-end="url(#arr2a78d6)"/><rect x="196.0" y="366.0" width="44.0" height="28.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/><text x="218.0" y="416.0" font-size="15.6" text-anchor="middle" fill="#52514e" font-weig