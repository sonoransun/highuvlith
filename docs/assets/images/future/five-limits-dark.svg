<title id="t">The five limits that frame the future of lithography</title>
<desc id="d">Five tiles, one per constraint: diffraction HP = k1 lambda over NA with k1 at least 0.25; photons per feature proportional to lambda cubed over NA squared; the resist trade-off Z = HP cubed times LER squared times dose; electron blur of about 2 nm; throughput t = t0 plus dose times area over power.</desc>
