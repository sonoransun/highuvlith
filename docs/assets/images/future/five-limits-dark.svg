<text x="614" y="56" font-size="13" text-anchor="start" fill="#f4f3f8" font-weight="600">Electron blur</text>
<text x="672" y="96" font-size="17" text-anchor="middle" fill="#f4f3f8" font-weight="600">σ ≈ 2 nm</text>
