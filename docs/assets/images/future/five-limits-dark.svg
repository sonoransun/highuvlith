<text x="50" y="56" font-size="13" text-anchor="start" fill="#f4f3f8" font-weight="600">Diffraction</text>
<text x="108" y="96" font-size="17" text-anchor="middle" fill="#f4f3f8" font-weight="600">HP = k₁ λ / NA</text>
<text x="108" y="124" font-size="12.5" text-anchor="middle" fill="#c3c2b7" font-weight="400">k₁ ≥ 0.25 single exposure</text>
<rect x="208" y="28" width="176" height="124" rx="8" fill="#2c2a35" stroke="none" stroke-width="1.2"/>
<rect x="208" y="28" width="176" height="3" rx="0" fill="#a78bfa" stroke="none" stroke-width="1.2"/>
<text x="220" y="56" font-size="12.5" text-anchor="start" fill="#9b99a3" font-weight="600">2</text>
<text x="238" y="56" font-size="13" text-anchor="start" fill="#f4f3f8" font-weight="600">Photons</text>
<text x="296" y="96" font-size="17" text-anchor="middle" fill="#f4f3f8" font-weight="600">N ∝ λ³ / NA²</text>
<text x="296" y="124" font-size="12.5" text-anchor="middle" fill="#c3c2b7" font-weight="400">at fixed dose and k₁</text>
<rect x="396" y="28" width="176" height="124" rx="8" fill="#2c2a35" stroke="none" stroke-width="1.2"/>
<rect x="396" y="28" width="176" height="3" rx="0" fill="#a78bfa" stroke="none" stroke-width="1.2"/>
<text x="408" y="56" font-size="12.5" text-anchor="start" fill="#9b99a3" font-weight="600">3</text>
<text x="426" y="56" font-size="13" text-anchor="start" fill="#f4f3f8" font-weight="600">Resist trade-off</text>
<text x="484" y="96" font-size="17" text-anchor="middle" fill="#f4f3f8" font-weight="600">Z = HP³ · LER² · D</text>
<text x="484" y="124" font-size="12.5" text-anchor="middle" fill="#c3c2b7" font-weight="400">pick two of three</text>
<rect x="584" y="28" width="176" height="124" rx="8" fill="#2c2a35" stroke="none" stroke-width="1.2"/>
