<text x="103" y="88" font-size="18" text-anchor="middle" fill="#f4f3f8" font-weight="600">HP = k₁ λ / NA</text>
<text x="103" y="116" font-size="12.5" text-anchor="middle" fill="#c3c2b7" font-weight="400">k₁ ≥ 0.25 single exposure</text>
