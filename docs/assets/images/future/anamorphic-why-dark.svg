<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">Why High-NA EUV optics are anamorphic</title><desc id="d">Three panels show the cone of light that illuminates a reflective EUV mask and the cone it reflects, around the mask normal. Left: 0.33 NA at 4x reduction, the mask-side cone half-angle is 4.7 degrees and, tilted by a 6 degree chief-ray angle, the two cones do not overlap. Middle: 0.55 NA at 4x would need a 7.9 degree half-angle, so the incident and reflected cones overlap around the normal. Right: with 8x reduction in the scan direction the half-angle drops to 3.9 degrees and the cones separate again; the other direction keeps 4x. All panels use an illustrative 6 degree illumination angle. Angles are drawn three times larger than real.</desc><defs><marker id="arrb5a1ff" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5a1ff"/></marker><marker id="arr22d3ee" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker></defs><rect x="30.0" y="20.0" width="300.0" height="455.0" rx="10" fill="#2a2834" stroke="none" stroke-width="1.5"/><text x="180.0" y="50.0" font-size="18.9" text-anchor="middle" fill="#f1f0ee" font-weight="bold">NXE: NA 0.33, 4×</text><text x="180.0" y="74.0" font-size="15.0" text-anchor="middle" fill="#c3c2b7" font-weight="normal"><tspan x="180.0" dy="0.0">cone half-angle asin(NA/M) = 4.7°</tspan><tspan x="180.0" dy="18.8">illumination ≈ 6° (illustrative)</tspan></text><rect x="60.0" y="370.0" width="240.0" height="16.0" rx="0.0" fill="#4a4852" stroke="#c3c2b7" stroke-width="1.2"/><line x1="60.0" y1="374.0" x2="300.0" y2="374.0" stroke="#c3c2b7" stroke-width="0.6" stroke-linecap="round" stroke-opacity="0.6"/><line x1="60.0" y1="378.0" x2="300.0" y2="378.0" stroke="#c3c2b7" stroke-width="0.6" stroke-linecap="round" stroke-opacity="0.6"/><line x1="60.0" y1="382.0" x2="300.0" y2="382.0" stroke="#c3c2b7" stroke-width="0.6" stroke-linecap="round" stroke-opacity="0.6"/><text x="180.0" y="404.0" font-size="14.3" text-anchor="middle" fill="#a3a29b" font-weight="normal">reflective multilayer mask</text><line x1="180.0" y1="370.0" x2="180.0" y2="118.0" stroke="#a3a29b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="184.0" y="128.0" font-size="13.0" text-anchor="start" fill="#a3a29b" font-weight="normal">normal</text><polygon points="180.0,370.0 60.1,179.6 165.1,145.5" fill="#352a66" stroke="#b5a1ff" stroke-width="1.5" fill-opacity="0.85" stroke-linejoin="round"/><polygon points="180.0,370.0 194.9,145.5 299.9,179.6" fill="#0f3d48" stroke="#22d3ee" stroke-width="1.5" fill-opacity="0.85" stroke-linejoin="round"/><line x1="110.5" y1="156.0" x2="180.0" y2="370.0" stroke="#b5a1ff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrb5a1ff)"/><line x1="180.0" y1="370.0" x2="249.5" y2="156.0" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" marker-end="url(#arr22d3ee)"/><text x="122.0" y="142.0" font-size="14.3" text-anchor="end" fill="#c3c2b7" font-weight="normal"><tspan x="122.0" dy="0.0">from</tspan><tspan x="122.0" dy="17.9">illuminator</tspan></text><text x="238.0" y="142.0" font-size="14.3" text-anchor="start" fill="#c3c2b7" font-weight="normal"><tspan x="238.0" dy="0.0">to projection</tspan><tspan x="238.0" dy="17.9">optics</tspan></text><text x="180.0" y="430.0" font-size="15.6" text-anchor="middle" fill="#f1f0ee" font-weight="bold">cones separate</text><rect x="345.0" y="20.0" width="300.0" height="455.0" rx="10" fill="#2a2834" stroke="none" stroke-width="1.5"/><text x="495.0" y="50.0" font-size="18.9" text-anchor="middle" fill="#f1f0ee" font-weight="bold">NA 0.55 at 4× (not built)</text><text x="495.0" y="74.0" font-size="15.0" text-anchor="middle" fill="#c3c2b7" font-weight="normal"><tspan x="495.0" dy="0.0">cone half-angle asin(NA/M) = 7.9°</tspan><tspan x="495.0" dy="18.8">illumination ≈ 6° (illustrative)</tspan></text><rect x="375.0" y="370.0" width="240.0" height="16.0" rx="0.0" fill="#4a4852" stroke="#c3c2b7" stroke-width="1.2"/><line x1="375.0" y1="374.0" x2="615.0" y2="374.0" stroke="#c3c2b7" stroke-width="0.6" stroke-linecap="round" stroke-opacity="0.6"/><line x1="375.0" y1="378.0" x2="615.0" y2="378.0" stroke="#c3c2b7" stroke-width="0.6" stroke-linecap="round" stroke-opacity="0.6"/><line x1="375.0" y1="382.0" x2="615.0" y2="382.0" stroke="#c3c2b7" stroke-width="0.6" stroke-linecap="round" stroke-opacity="0.6"/><text x="495.0" y="404.0" font-size="14.3" text-anchor="middle" fill="#a3a29b" font-weight="normal">reflective multilayer mask</text><line x1="495.0" y1="370.0" x2="495.0" y2="118.0" stroke="#a3a29b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="499.0" y="128.0" font-size="13.0" text-anchor="start" fill="#a3a29b" font-weight="normal">normal</text><polygon points="495.0,370.0 345.3,202.0 517.4,146.1" fill="#352a66" stroke="#b5a1ff" stroke-width="1.5" fill-opacity="0.85" stroke-linejoin="round"/><polygon points="495.0,370.0 472.6,146.1 644.7,202.0" fill="#0f3d48" stroke="#22d3ee" stroke-width="1.5" fill-opacity="0.85" stroke-linejoin="round"/><line x1="425.5" y1="156.0" x2="495.0" y2="370.0" stroke="#b5a1ff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrb5a1ff)"/><line x1="495.0" y1="370.0" x2="564.5" y2="156.0" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" marker-end="url(#arr22d3ee)"/><text x="437.0" y="142.0" font-size="14.3" text-anchor="end" fill="#c3c2b7" font-weight="normal"><tspan x="437.0" dy="0.0">from</tspan><tspan x="437.0" dy="17.9">illuminator</tspan></text><text x="553.0" y="142.0" font-size="14.3" text-anchor="start" fill="#c3c2b7" font-weight="normal"><tspan x="553.0" dy="0.0">to projection</tspan><tspan x="553.0" dy="17.9">optics</tspan></text><polygon points="495.0,370.0 472.6,146.1 517.4,146.1" fill="#5a1f24" stroke="#ff7b7b" stroke-width="2" stroke-linejoin="round"/><text x="495.0" y="430.0" font-size="15.6" text-anchor="middle" fill="#ff7b7b" font-weight="bold"><tspan x="495.0" dy="0.0">cones overlap: the mask would</tspan><tspan x="495.0" dy="19.5">shadow its own light path</tspan></text><rect x="660.0" y="20.0" width="300.0" height="455.0" rx="10" fill="#2a2834" stroke="none" stroke-width="1.5"/><text x="810.0" y="50.0" font-size="18.9" text-anchor="middle" fill="#f1f0ee" font-weight="bold">EXE: NA 0.55, 8× in scan</text><text x="810.0" y="74.0" font-size="15.0" text-anchor="middle" fill="#c3c2b7" font-weight="normal"><tspan x="810.0" dy="0.0">cone half-angle asin(NA/M) = 3.9°</tspan><tspan x="810.0" dy="18.8">illumination ≈ 6° (illustrative)</tspan></text><rect x="690.0" y="370.0" width="240.0" height="16.0" rx="0.0" fill="#4a4852" stroke="#c3c2b7" stroke-width="1.2"/><line x1="690.0" y1="374.0" x2="930.0" y2="374.0" stroke="#c3c2b7" stroke-width="0.6" stroke-linecap="round" stroke-opacity="0.6"/><line x1="690.0" y1="378.0" x2="930.0" y2="378.0" stroke="#c3c2b7" stroke-width="0.6" stroke-linecap="round" stroke-opacity="0.6"/><line x1="690.0" y1="382.0" x2="930.0" y2="382.0" stroke="#c3c2b7" stroke-width="0.6" stroke-linecap="round" stroke-opacity="0.6"/><text x="810.0" y="404.0" font-size="14.3" text-anchor="middle" fill="#a3a29b" font-weight="normal">reflective multilayer mask</text><line x1="810.0" y1="370.0" x2="810.0" y2="118.0" stroke="#a3a29b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="814.0" y="128.0" font-size="13.0" text-anchor="start" fill="#a3a29b" font-weight="normal">normal</text><polygon points="810.0,370.0 698.1,174.8 785.8,146.3" fill="#352a66" stroke="#b5a1ff" stroke-width="1.5" fill-opacity="0.85" stroke-linejoin="round"/><polygon points="810.0,370.0 834.2,146.3 921.9,174.8" fill="#0f3d48" stroke="#22d3ee" stroke-width="1.5" fill-opacity="0.85" stroke-linejoin="round"/><line x1="740.5" y1="156.0" x2="810.0" y2="370.0" stroke="#b5a1ff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrb5a1ff)"/><line x1="810.0" y1="370.0" x2="879.5" y2="156.0" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" marker-end="url(#arr22d3ee)"/><text x="752.0" y="142.0" font-size="14.3" text-anchor="end" fill="#c3c2b7" font-weight="normal"><tspan x="752.0" dy="0.0">from</tspan><tspan x="752.0" dy="17.9">illuminator</tspan></text><text x="868.0" y="142.0" font-size="14.3" text-anchor="start" fill="#c3c2b7" font-weight="normal"><tspan x="868.0" dy="0.0">to projection</tspan><tspan x="868.0" dy="17.9">optics</tspan></text><text x="810.0" y="430.0" font-size="15.6" text-anchor="middle" fill="#f1f0ee" font-weight="bold">cones separate again</text><text x="480.0" y="494.0" font-size="14.3" text-anchor="middle" fill="#a3a29b" font-weight="normal"><tspan x="480.0" dy="0.0">Plane of incidence = scan direction; angles drawn 3× larger than real.</tspan><tspan x="480.0" dy="17.9">Across the slit the optics keep 4× (no overlap problem there), so the wafer field</tspan><tspan x="480.0" dy="17.9">is 26 mm wide but only 16.5 mm long in the scan direction.</tspan></text></svg>
