<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">Inverse Compton scattering, head-on geometry</title><desc id="d">Top row, before the collision: an electron bunch travelling to the right and a laser pulse travelling to the left approach the interaction point. Bottom row, after: photons scattered off the relativistic electrons leave in a forward cone of half-angle about one over gamma, their wavelength shortened by about four gamma squared. Example: a 1030 nm laser and 1.72 MeV electrons give 13.5 nm on axis, in a cone of about 13 degrees.</desc><defs><marker id="arr6aa6ee" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6aa6ee"/></marker><marker id="arrf08a5d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker></defs><text x="30.0" y="36.0" font-size="16.9" text-anchor="start" fill="#a3a29b" font-weight="bold">before</text><ellipse cx="230.0" cy="95.0" rx="60.0" ry="22.0" fill="#1f3552" stroke="#6aa6ee" stroke-width="2"/><circle cx="190.0" cy="83.0" r="3.0" fill="#6aa6ee" stroke="none" stroke-width="1.5"/><circle cx="227.0" cy="106.0" r="3.0" fill="#6aa6ee" stroke="none" stroke-width="1.5"/><circle cx="264.0" cy="105.0" r="3.0" fill="#6aa6ee" stroke="none" stroke-width="1.5"/><circle cx="221.0" cy="104.0" r="3.0" fill="#6aa6ee" stroke="none" stroke-width="1.5"/><circle cx="258.0" cy="103.0" r="3.0" fill="#6aa6ee" stroke="none" stroke-width="1.5"/><circle cx="215.0" cy="102.0" r="3.0" fill="#6aa6ee" stroke="none" stroke-width="1.5"/><circle cx="252.0" cy="101.0" r="3.0" fill="#6aa6ee" stroke="none" stroke-width="1.5"/><circle cx="209.0" cy="100.0" r="3.0" fill="#6aa6ee" stroke="none" stroke-width="1.