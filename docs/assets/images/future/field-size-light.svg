<title id="t">High-NA field size: full field, anamorphic half field, 6 × 12-inch mask</title>
<desc id="d">Three wafer fields to scale: 26 by 33 mm from a 6-inch mask at 4x, a 26 by 16.5 mm anamorphic half field with a stitching seam for larger dies, and 26 by 33 mm restored by a 6 by 12-inch mask; stitching is press-reported to cut 175 wafers per hour to about 125; the dates are announced plans.</desc>
