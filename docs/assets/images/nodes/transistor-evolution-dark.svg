<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Transistor architecture evolution</title>
<desc id="d">Four schematic cross-sections cut across the channel: a planar MOSFET with the gate on top only; a FinFET whose gate wraps three sides of two silicon fins; a gate-all-around nanosheet transistor with three stacked sheets fully surrounded by the gate; and a CFET with nFET sheets stacked under pFET sheets inside one gate.</desc>
