<title id="t">An EUV mask: Mo/Si multilayer mirror, Ru cap, absorber, 6-degree chief ray, pellicle</title>
<desc id="d">Cross-section of an EUV reticle. A low-expansion substrate carries 40 to 50 Mo/Si bilayers (eight drawn) capped with ruthenium; a tantalum-based absorber tens of nanometres thick is patterned on top. The chief ray arrives 6 degrees off normal, so the absorber casts a shadow (hatched) on the mirror beside it, and a thin pellicle above the mask is crossed twice. The simulator's mask is a thin transmittance map with none of these effects.</desc>
