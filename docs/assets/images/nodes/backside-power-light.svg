<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Front-side versus backside power delivery</title>
<desc id="d">Left: conventional front-side power delivery, where power and signal wires share one metal stack above the transistors and supply current travels down through every layer. Right: backside power delivery, where the wafer is thinned and a power network on the back connects to the transistors through nano through-silicon vias, leaving the front metal stack for signals.</desc>
