<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 445" width="860" height="445" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Standard-cell anatomy: CPP, MMP and track height</title>
<desc id="d">Top view of a schematic logic standard cell. Vertical gate lines repeat at the contacted poly pitch (CPP); horizontal routing tracks repeat at the minimum metal pitch (MMP). Power rails run along the top and bottom edges. The cell height equals the number of tracks times the metal pitch; the cell width is a whole number of CPPs.</desc>
