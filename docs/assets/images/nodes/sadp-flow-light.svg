<title id="t">Self-aligned double patterning (SADP)</title>
<desc id="d">Five-step SADP flow in cross-section. 1: mandrel lines printed at pitch P. 2: a conformal spacer film is deposited. 3: an anisotropic etch leaves spacers only on the mandrel sidewalls. 4: the mandrels are removed, leaving two spacer lines per mandrel at pitch P/2. 5: the spacer pattern is etched into the target layer.</desc>
