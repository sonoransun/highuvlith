<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Anamorphic High-NA imaging halves the exposure field</title>
<desc id="d">A 6-inch reticle's 104 by 132 mm image area maps to a 26 by 33 mm full field at 4x reduction in both directions (0.33 NA systems). High-NA optics reduce 4x across the scan and 8x along the scan, so the same reticle area prints a 26 by 16.5 mm half field; larger dies must be stitched from two exposures.</desc>
<defs><marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker><marker id="arr-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="arr-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a3aa7"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008300"/></marker></defs>
<text x="178.4" y="40.0" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="600">reticle image area</text>
<rect x="90.0" y="70.0" width="176.8" height="224.4" rx="4" fill="#dedcef" stroke="#4a3aa7" stroke-width="1.4"/>
<line x1="90.0" y1="316.4" x2="266.8" y2="316.4" stroke="#52514e" stroke-width="1.1" stroke-linecap="round" marker-end="url(#arr-ink2)" marker-start="url(#arr-ink2)"/>
<line x1="90.0" y1="310.4" x2="90.0" y2="322.4" stroke="#52514e" stroke-width="1.0" stroke-linecap="round"/>
