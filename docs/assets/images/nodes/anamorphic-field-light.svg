<title id="t">Anamorphic High-NA imaging halves the exposure field</title>
<desc id="d">A 6-inch reticle's 104 by 132 mm image area maps to a 26 by 33 mm full field at 4x reduction in both directions (0.33 NA systems). High-NA optics reduce 4x across the scan and 8x along the scan, so the same reticle area prints a 26 by 16.5 mm half field; larger dies must be stitched from two exposures.</desc>
