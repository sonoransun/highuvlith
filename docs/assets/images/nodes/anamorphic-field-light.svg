<text x="178.4" y="333.4" font-size="13" text-anchor="middle" fill="#52514e" font-weight="400">104 mm</text>
<line x1="76.0" y1="70.0" x2="76.0" y2="294.4" stroke="#52514e" stroke-width="1.1" stroke-linecap="round" marker-end="url(#arr-ink2)" marker-start="url(#arr-ink2)"/>
