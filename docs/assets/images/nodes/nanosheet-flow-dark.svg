<title id="t">How a nanosheet transistor is built</title>
<desc id="d">Four cross-section steps: a silicon / silicon-germanium superlattice is grown; the stack is patterned into a narrow ribbon; the silicon-germanium is etched away selectively, leaving suspended silicon sheets; the gate dielectric and metal wrap every sheet. An inset contrasts a FinFET, whose drive is quantized in whole fins, with nanosheets whose width is a design variable.</desc>
