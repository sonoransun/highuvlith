<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Self-aligned quadruple patterning (SAQP)</title>
<desc id="d">SAQP repeats the spacer trick twice. 1: mandrels at pitch P. 2: first spacers remain after the mandrel pull, at pitch P/2. 3: second spacers are formed on the sidewalls of the first spacers. 4: the first spacers are removed, leaving lines at pitch P/4.</desc>
