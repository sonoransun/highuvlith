<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Stochastic failure modes</title>
<desc id="d">Illustrative sketch of stochastic printing failures. Left: a contact-hole array with slightly different hole sizes, one missing contact and two merged (kissing) contacts. Right: dense lines with rough edges (line-edge roughness), a microbridge joining two lines and a break in one line.</desc>
