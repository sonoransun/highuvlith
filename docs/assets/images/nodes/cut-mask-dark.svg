<title id="t">Cut and via masks carve a circuit out of a spacer grating</title>
<desc id="d">Three top views. Left: the regular line grating that spacer patterning produces. Middle: cut masks remove line segments to make line ends and via masks connect the survivors to the level above. Right: a cut that lands shifted by a few nanometres clips the neighbouring line and leaves a sliver on the intended one; the shift is dimensioned as the edge-placement error.</desc>
