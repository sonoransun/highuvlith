<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Pitch walk in SADP</title>
<desc id="d">Three rows of SADP lines. Nominal: core spaces (where mandrels were) equal gap spaces, so the pitch is uniform. Mandrel CD error: core spaces widen by delta and gap spaces shrink by delta, so line pairs alternate and the pitch walks. Spacer-thickness error: lines widen and only the gap spaces shrink, by twice the error.</desc>
