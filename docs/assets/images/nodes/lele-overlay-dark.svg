<title id="t">LELE double patterning and overlay</title>
<desc id="d">Litho-etch-litho-etch splits a dense line array between two masks, A and B, each at twice the target pitch. With perfect overlay the combined pattern has equal spaces. If mask B lands shifted by an overlay error delta, the spaces alternate between s minus delta and s plus delta: overlay error becomes space-CD error one-to-one.</desc>
