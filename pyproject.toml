[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "highuvlith"
version = "0.2.0"
description = "Lithography simulator from VUV (157/126 nm) through EUV (13.5 nm) and BEUV (6.7 nm) to soft/hard X-ray, with a Rust physics engine"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://sonoransun.github.io/highuvlith/"
Repository = "https://github.com/sonoransun/highuvlith"
Documentation = "https://sonoransun.github.io/highuvlith/python-api/"
Issues = "https://github.com/sonoransun/highuvlith/issues"

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
interactive = ["plotly>=5.0", "polars>=1.0"]
notebook = ["ipywidgets>=8.0"]
hdf5 = ["h5py>=3.9"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout>=2.0", "ruff>=0.4", "mypy>=1.10"]
all = ["highuvlith[viz,interactive,notebook,hdf5]"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.maturin]
manifest-path = "crates/highuvlith-py/Cargo.toml"
python-source = "python"
module-name = "highuvlith._native"
features = ["pyo3/extension-module"]
python-packages = ["highuvlith"]
