  # Narrative sections: page order follows each section's index page (S1/S2/S3).
  - History:
      - history/index.md
      - From stone to silicon: history/origins.md
      - The projection era: history/projection-era.md
      - Excimer lasers & deep UV: history/excimer-duv.md
      - The 157 nm detour: history/157nm-detour.md
      - Immersion & multipatterning: history/immersion-multipatterning.md
      - The road to EUV: history/euv.md
      - Parallel paths: history/parallel-paths.md
  - Process Nodes:
      - nodes/index.md
      - 90 nm to 28 nm: nodes/90-to-28nm.md
      - 22 nm to 10 nm: nodes/22-to-10nm.md
      - 7 nm and 5 nm: nodes/7-and-5nm.md
      - 3 nm and 2 nm: nodes/3nm-and-2nm.md
      - The Ångström era: nodes/angstrom-era.md
      - Lithography arithmetic: nodes/litho-math.md
  - The Future:
      - future/index.md
      - High-NA and Hyper-NA EUV: future/high-na-and-hyper-na.md
      - Beyond EUV (6.x nm and X-rays): future/beyond-euv.md
      - Accelerator light sources: future/accelerator-light-sources.md
      - The stochastic frontier: future/stochastic-frontier.md
      - Alternatives to projection: future/alternative-patterning.md
      - Quantum and exotic lithography: future/quantum-and-exotic.md
  - Simulator:
      - Getting started: getting-started.md
      - Architecture: architecture.md
      - Simulation pipeline: pipeline.md
      - Optical systems: optics.md
      - Vector imaging: vector-imaging.md
      - Masks & metrics: masks-and-metrics.md
      - Materials: materials.md
      - Sources:
          - sources/index.md
          - DUV/UV heritage: sources/duv-heritage.md
          - VUV excimer: sources/vuv-excimer.md
          - Laser-produced plasma: sources/lpp.md
          - Discharge-produced plasma: sources/dpp.md
          - Synchrotron: sources/synchrotron.md
          - XFEL: sources/xfel.md
          - LPA-FEL: sources/lpa-fel.md
          - High-harmonic generation: sources/hhg.md
          - Soft X-ray laser: sources/soft-xray-laser.md
          - Inverse Compton: sources/inverse-compton.md
          - Betatron: sources/betatron.md
          - SSMB: sources/ssmb.md
          - Smith–Purcell: sources/smith-purcell.md
          - X-ray tube: sources/xray-tube.md
          - Entangled photons: sources/entangled-photon.md
      - Processes:
          - processes/index.md
          - Thin film: processes/thin-film.md
          - Resist models: processes/resist-models.md
          - Volumetric exposure: processes/volumetric-exposure.md
          - LIGA deep X-ray: processes/liga-deep-xray.md
          - Grayscale: processes/grayscale.md
          - Interference & two-photon: processes/interference-volumetric.md
          - Talbot lithography: processes/talbot.md
      - Research modules: research-modules.md
  - Reference:
      - Capability matrix: capability-matrix.md
      - TOML configuration: configuration.md
      - CLI: cli.md
      - GUI: gui.md
      - Python API: python-api.md
  - Develop:
      - Extending highuvlith: extending.md
      - Roadmap: roadmap.md
      - Contributing: https://github.com/sonoransun/highuvlith/blob/main/CONTRIBUTING.md
  - Playground: playground/index.md
