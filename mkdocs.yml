# MkDocs configuration for the highuvlith documentation site (GitHub Pages).
#
# Local preview (a separate venv keeps the docs toolchain out of the project env):
#   python -m venv .venv-docs && .venv-docs/bin/pip install -r docs/requirements-docs.txt
#   .venv-docs/bin/mkdocs serve              # live reload at http://127.0.0.1:8000
#   .venv-docs/bin/mkdocs build --strict     # what CI runs
#
# Deployment: .github/workflows/pages.yml builds on every push to main and publishes
# with the official GitHub Pages actions. One-time repository setting required:
# Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".

site_name: highuvlith
site_description: >-
  An honesty-first lithography simulator from VUV through EUV to X-ray, with a guided
  tour of lithography's history, today's process nodes, and where the physics may go.
site_author: highuvlith contributors

# repo_url and the branch in edit_uri also drive docs/hooks/repo_links.py, which turns
# links to source files outside docs/ into GitHub URLs.
site_url: https://sonoransun.github.io/highuvlith/
repo_url: https://github.com/sonoransun/highuvlith
repo_name: sonoransun/highuvlith
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 the highuvlith authors &middot; MIT License

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/brand/logo.svg
  favicon: assets/brand/favicon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    # Follow the operating-system preference until the reader picks a scheme.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

# Site plumbing that lives under docs/ but is not published as pages or assets.
# Links to these files from pages are rewritten to GitHub by docs/hooks/repo_links.py.
exclude_docs: |
  hooks/
  includes/
  overrides/
  figures/
  javascripts/tests/
  __pycache__/
  /requirements-docs.txt

hooks:
  # Links leaving docs/ (../crates/..., ../README.md, ../examples/...) -> GitHub URLs.
  - docs/hooks/repo_links.py
  # Nav entries for pages not yet in this checkout are skipped locally, strict in CI.
  - docs/hooks/pending_nav.py
  # **Status:** lines and the ✅ 🔶 🧪 🗺️ markers -> styled, labelled badges.
  - docs/hooks/status_badges.py

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  # Python-Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      # GitHub-compatible anchors, so #fragments written for GitHub work here too.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.snippets:
      # Site-wide glossary: every page gets the abbreviation tooltips.
      auto_append:
        - docs/includes/abbreviations.md
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        # ```math blocks render here AND on GitHub. Prefer them for display math: inside
        # $$...$$ GitHub strips backslash escapes (\, \{ \% ...) before rendering.
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format
            kwds:
              mode: generic
              tag: div
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde:
      # Strikethrough only: "~13.5 nm ... ~6.7 nm" must never become a subscript.
      subscript: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  # MathJax for pymdownx.arithmatex (Material for MkDocs recipe), pinned to v3.2.2.
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
  # Wide mermaid diagrams scroll instead of shrinking on narrow screens.
  - javascripts/diagrams.js
  # Playground calculators (self-activate only on pages that contain them).
  - javascripts/huv-physics.js
  - javascripts/playground.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sonoransun/highuvlith
      name: highuvlith on GitHub
  status:
    new: Recently added

validation:
  nav:
    omitted_files: warn  # every page must be in the nav (all sections have landed)
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

nav:
