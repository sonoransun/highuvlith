[package]
name = "highuvlith-cli"
version = "0.2.0"
edition = "2021"
description = "Command-line interface for the highuvlith lithography simulator (TOML-driven simulate, sweep, deep, optimize, throughput, sources and materials commands)"
license = "MIT"
repository = "https://github.com/sonoransun/highuvlith"
homepage = "https://sonoransun.github.io/highuvlith/"
documentation = "https://sonoransun.github.io/highuvlith/"
readme = "../../README.md"

[[bin]]
name = "highuvlith"
path = "src/main.rs"

[dependencies]
highuvlith-core = { path = "../highuvlith-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
indicatif = "0.17"
anyhow = "1.0"
num = "0.4"
ndarray = "0.16"
