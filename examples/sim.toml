# =============================================================================
# F2 excimer VUV (157.63 nm) — the minimal back-compatible configuration
# =============================================================================
#
# No `type` in [source]: the legacy VUV excimer source is built from
# wavelength_nm / sigma / bandwidth_pm (40 W, 4 kHz defaults). 65 nm opaque
# lines on a 180 nm pitch at NA 0.75 (k1 = 90 x 0.75 / 157.63 = 0.43).
#
# The 256 x 1 nm grid is not commensurate with the 180 nm pitch, so the CLI
# rescales the pixel to 0.703 nm (180 nm field = one period; it prints a note).
#
# Result (highuvlith simulate): contrast 0.454, NILS 0.65, printed CD 41.2 nm at
# the I = 0.3 threshold — the 65 nm drawn line prints narrow at this dose.
#
# Run with:  highuvlith simulate --config examples/sim.toml
# -----------------------------------------------------------------------------

[source]
wavelength_nm = 157.63  # F2 excimer laser
sigma = 0.7
bandwidth_pm = 1.1

[optics]
na = 0.75
flare_fraction = 0.02

[mask]
cd_nm = 65.0
pitch_nm = 180.0

[grid]
size     = 256     # 1 nm requested; the CLI snaps to 0.703125 nm so the 180 nm
pixel_nm = 1.0     #   field holds exactly 1 pitch (it prints a note)

[process]
dose_mj_cm2 = 30.0
focus_nm = 0.0
