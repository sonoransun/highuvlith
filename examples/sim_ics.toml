# =============================================================================
# Inverse Compton scattering (ICS) — compact EUV at 13.5 nm  [THEORETICAL]
# =============================================================================
#
# A laser pulse collides head-on with a relativistic electron bunch; the
# back-scattered photons are Doppler-upshifted by ~4γ², so only MeV-class
# electrons are needed to reach EUV from an optical laser — the promise of a
# room-sized short-wavelength source. The on-axis scattered wavelength is
#
#     λ_X = λ_L (1 + a0²/2 + γ²θ²) / (4 γ²)   ≈  λ_L / (4 γ²)   (small a0, on-axis)
#
# The electron energy is DERIVED from the target wavelength: for 13.5 nm from a
# 1030 nm Yb laser, γ = √(λ_L / (4 λ_X)) = √(1030 / 54) ≈ 4.37 (≈ 1.7 MeV). The
# nonlinear (a0) and off-axis (θ) terms both redshift the line and set the
# bandwidth.
#
# The photon yield is DERIVED from the collision (Thomson luminosity):
#     N_x = σ_T N_e N_L / (2π(σ_e² + σ_L²)) = 1.7e6 photons per collision
# for 100 pC, 10 mJ (1030 nm), 10 µm spots. Only 2.8 % of them fall inside the
# 2 % Mo/Si band (cone ≈ 32 mrad at γ = 4.4), so at 100 MHz the in-band power is
# ≈ 71 µW — about 3.5 million times short of a 250 W HVM source, even at this
# aggressive (MW-class enhancement-cavity) design point.
#
# STATUS — THEORETICAL: the Compton kinematics are exact, but ICS as a
# *lithography* source is a parameterized concept — flux at wafer-relevant dose
# rates has not been demonstrated. Treat outputs as research projections.
#
# Reference: Krafft & Priebe, "Compton sources of electromagnetic radiation,"
#            Rev. Accel. Sci. Technol. 3, 147 (2010).
#
# Run with:  highuvlith simulate --config examples/sim_ics.toml
# -----------------------------------------------------------------------------

[source]
type                 = "ics"
wavelength_nm        = 13.5     # target; sets the required electron energy
laser_wavelength_nm  = 1030.0   # Yb drive laser (must exceed the target)
laser_a0             = 0.1      # normalized vector potential (a0 ≪ 1 = linear)
# Collision parameters (illustrative aggressive design point) → derived yield:
bunch_charge_pc       = 100.0
laser_pulse_energy_mj = 10.0     # circulating pulse energy of an enhancement cavity
electron_spot_um      = 10.0
laser_spot_um         = 10.0
rep_rate_hz           = 1.0e8
# collection_half_angle_mrad = 32.4   # default with collision fields: the 2 % band
# electron_energy_spread_rel = 0.005

[optics]
# EUV has no transparent lens material, so the optics are mirrors: the
# NXE-class projection pupil (NA 0.33, unobscured). Do not pair this nearly
# coherent laser-like fill (sigma ~0.05) with a centrally obscured
# Schwarzschild (type = "schwarzschild", obscuration 0.25-0.3 of the NA): the
# obscuration blocks the zero diffraction order and the image becomes DARK
# FIELD (frequency-doubled fringes; the CLI warns). A Schwarzschild needs a
# pupil fill larger than its obscuration.
type = "euv_projection"
na   = 0.33

[mask]
cd_nm    = 30.0
pitch_nm = 60.0

[grid]
size     = 128     # 2 nm requested; the CLI snaps to 1.875 nm so the 240 nm
pixel_nm = 2.0     #   field holds exactly 4 pitches (it prints a note)

[process]
dose_mj_cm2 = 30.0
focus_nm    = 0.0
