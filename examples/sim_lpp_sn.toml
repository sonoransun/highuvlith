# =============================================================================
# Laser-produced plasma (LPP) — tin at 13.5 nm (production EUV source)
# =============================================================================
#
# The production EUV source: a CO2 drive laser vaporizes tin droplets into a
# dense plasma whose Sn XIII–XV lines emit in the 2% band that Mo/Si multilayer
# mirrors reflect around 13.5 nm. The in-band power at intermediate focus (IF),
# the industry hand-off point, follows the efficiency chain
#
#     P_IF = P_drive · CE · η_(2π→IF) · f_étendue
#          = 21.5 kW · 0.06 · 0.194 · 1 = 250 W   (the NXE:3400B source)
#
# where CE (6 % for the NXE:3400B source; ASML quotes > 5.5 %, CO2 + pre-pulse)
# is the drive → in-band (2π sr) fraction and η_(2π→IF) lumps collector solid
# angle, collector reflectance and debris/gas losses (≈ 0.194, calibrated so the
# 21.5 kW / 6 % / 50 kHz source gives its 250 W at IF). Tin droplets (~25 µm at
# 70 m/s per ASML; ~30 µm per Versolato's review) are flattened by a pre-pulse
# and hit by the main pulse 50,000 times per second. Current tools are higher:
# the NXE:3800E ships with a 500 W source and 1 kW was demonstrated in 2025
# (ASML). The étendue check compares
# the source étendue (π d²/4 · Ω_collector = 0.16 mm²·sr for 200 µm, 5 sr) with
# the illuminator budget (3.3 mm²·sr): margin 21, so nothing is lost. Wafer-side
# optics losses belong to the throughput model, not to the source.
# The plasma is spatially INCOHERENT (large-σ disk illumination); the mirror
# stack, not the plasma, sets the ~2% (270 pm) usable bandwidth.
#
# Reference: Fomenkov et al., "Light sources for high-volume manufacturing EUV
#            lithography," Adv. Opt. Technol. 6, 173 (2017).
#
# Result (highuvlith simulate): 250 W at IF, 86 drive W per IF W; image
# contrast 0.767, NILS 4.07, printed CD 30.6 nm (σ 0.7 with the Schwarzschild's
# 0.25 central obscuration — a large incoherent fill is what an obscured
# objective needs).
#
# Run with:  highuvlith simulate --config examples/sim_lpp_sn.toml
# -----------------------------------------------------------------------------

[source]
type = "lpp"
fuel = "sn"                    # tin → 13.5 nm (Mo/Si band)
# Family preset: 21.5 kW CO2 drive, 6 % CE, ≈0.194 2π→IF, 270 pm band, 50 kHz.
drive_laser = "co2"            # co2 | solid_state_1um | thulium_2um (sets the CE default)
# preset = "nxe3800e"          # 500 W at IF (drive power ASSUMED 43 kW); default "nxe3400b" = 250 W
# Override any of them explicitly:
# drive_laser_power_w    = 21500.0
# conversion_efficiency  = 0.06
# transport_efficiency   = 0.194  # in-band emission (2π sr) → intermediate focus
# bandwidth_pm           = 270.0
# Étendue check (defaults shown):
# source_diameter_um          = 200.0
# collection_solid_angle_sr   = 5.0
# illuminator_etendue_mm2_sr  = 3.3

[optics]
# 13.5 nm → reflective Schwarzschild objective (no refractive lens material).
type = "schwarzschild"
na   = 0.33

[mask]
cd_nm    = 30.0
pitch_nm = 60.0

[grid]
size     = 128     # 2 nm requested; the CLI snaps to 1.875 nm so the 240 nm
pixel_nm = 2.0     #   field holds exactly 4 pitches (it prints a note)

[process]
dose_mj_cm2 = 30.0
focus_nm    = 0.0
