# =============================================================================
# Interference (holographic) lithography — two-beam grating at 266 nm
# =============================================================================
#
# Two coherent plane waves crossed at a half-angle θ record their standing-wave
# interference pattern as a periodic grating in a single exposure — no mask, no
# lens. For equal-amplitude beams the intensity is I(x) = 2(1 + cos(K x)) and
# the fringe period is set purely by the AIR-side half-angle:
#
#     Λ = λ_vac / (2 sin θ_air)   = 266 / (2 sin 30°) = 266 nm
#
# This is INDEX-INVARIANT: refraction bends the beams toward normal inside the
# resist (sin θ_med = sin θ_air / n), but the in-plane wavevector — and hence Λ —
# is unchanged, so the resist index only affects the depth response, not the
# pitch. The 266 nm driver is the 4th harmonic of a Nd:YAG laser (1064/4), a
# common interference-lithography wavelength.
#
# The exposed intensity is mapped to photo-active-compound (PAC) via Dill
# kinetics — m = exp(−C·dose·I) for single-photon, exp(−C·dose·I²) for two-
# photon — and the reported fill fraction is the volume with m below the
# development threshold (the fraction that clears).
#
# Reference: Campbell et al., "Fabrication of photonic crystals for the visible
#            spectrum by holographic lithography," Nature 404, 53 (2000).
#
# Run with:  highuvlith deep --config examples/interference.toml --output /tmp/int.json
#            (or --output /tmp/int.png for the mid-depth PAC slice)
# -----------------------------------------------------------------------------

[source]
# 266 nm (4ω Nd:YAG). type defaults to "vuv"; the source model only supplies
# the vacuum wavelength to the interference setup.
wavelength_nm = 266.0

[optics]
na = 0.4        # unused by interference recording; present for the shared schema

[mask]
cd_nm    = 100.0    # unused (there is no mask in interference lithography)
pitch_nm = 300.0

[grid]
size     = 128      # lateral array
pixel_nm = 10.0     # 10 nm pixels → 1.28 µm field ≈ 4.8 fringes of 266 nm

[deep]
mode   = "interference"
preset = "two_beam"   # two_beam | three_beam_hex | four_beam_umbrella

half_angle_deg = 30.0   # air-side half-angle → Λ = λ/(2 sin θ) = 266 nm
n_medium       = 1.6    # resist refractive index (affects depth, not pitch)
two_photon     = false  # single-photon Dill kinetics
nz             = 16     # depth slices
z_span_nm      = 300.0  # resist recording depth
dose_scale     = 10.0   # Dill dose scale (high enough to clear the bright fringes)
dill_c         = 0.05   # Dill C coefficient
# fill_threshold = 0.5   # PAC clearing threshold (default 0.5)
