# =============================================================================
# LIGA deep X-ray lithography — 500 µm PMMA, synchrotron bending-magnet beam
# =============================================================================
#
# LIGA (Lithographie, Galvanoformung, Abformung) exposes very thick PMMA with
# the hard white beam of a synchrotron bending magnet, then electroplates the
# developed mold — the route to metal microstructures with aspect ratios in the
# hundreds. This is SHADOW printing: the Au-on-membrane mask sits a small gap
# above the resist and casts a near-geometric shadow (no pupil, no aerial TCC).
#
# Depth dose (absorbed-energy density vs depth z into the resist):
#
#     u(z) = Σ_j w_j E_j T_j μ_j exp(-μ_j z)
#
# summed over the sampled photon-energy bins j (weight w_j, energy E_j, beam-
# filter/membrane transmission T_j, resist attenuation μ_j). The beam HARDENS
# with depth — soft photons are absorbed first — so the local decay rate falls
# and u(z) is flatter than a single exponential. The figure of merit is the
# top/bottom dose ratio: PMMA has a usable dose window of ~2–4 kJ/cm³ (below
# 2 it will not clear, above ~20 it foams/damages), so the whole resist column
# must be kept inside that window. This config scales the bottom to the 3 kJ/cm³
# clearing dose and reports the top dose against the 20 kJ/cm³ damage ceiling.
# With this UNFILTERED 6.23 keV beam the top overshoots (~22 kJ/cm³, ratio ~7.4,
# damage flag EXCEEDED) — which is exactly why real LIGA beamlines add a
# beam-hardening filter (Be/Al/Kapton) to absorb the soft photons and flatten
# u(z); the depth-dose module supports upstream filters, they are just not
# exposed through this minimal TOML.
#
# Bending-magnet critical energy (half the radiated power lies above it):
#
#     E_c[keV] = 0.665 · E²[GeV²] · B[T] = 0.665 · 2.5² · 1.5 = 6.23 keV
#
# (KIT/ANKA-class parameters). E_c is DERIVED from the [source] machine
# parameters below; set [deep] critical_energy_kev instead to give it directly.
#
# Reference: Bley et al., "The LIGA process," and Malek & Saile,
#            Microelectron. J. 35, 131 (2004).
#
# Run with:  highuvlith deep --config examples/liga.toml --output /tmp/liga.json
#            (or --output /tmp/liga.png for the developed-depth map)
# -----------------------------------------------------------------------------

[source]
# Bending-magnet white beam. The wavelength/critical energy is DERIVED from the
# ring energy and field, not stored — E_c = 0.665·2.5²·1.5 = 6.23 keV.
type     = "synchrotron"
beamline = "bending_magnet"
electron_energy_gev = 2.5      # storage-ring energy
field_t             = 1.5      # bending-magnet field

[optics]
# Unused by LIGA shadow printing (there is no projection lens); present only to
# satisfy the shared config schema. No optics warning is emitted for `deep`.
na = 0.2

[mask]
# Au-absorber shadow mask: wide micron-scale bars (LIGA prints big, deep, not
# fine). cd = 20 µm bars on a 40 µm pitch. The developed-depth map shows the
# open columns clearing to full depth and the shadowed columns staying shallow.
cd_nm    = 20000.0
pitch_nm = 40000.0

[grid]
size     = 64        # small field; LIGA features are microns, not nanometers
pixel_nm = 2000.0    # 2 µm pixels → 128 µm field (≈ 3 mask periods)

[deep]
mode = "liga"

# Omit critical_energy_kev to derive E_c from the [source] bending magnet above.
# Uncomment to override with a measured/target value instead:
# critical_energy_kev = 6.23

resist_thickness_um = 500.0    # thick PMMA — the hallmark of LIGA
proximity_gap_um    = 100.0    # mask-to-resist gap; sets the Fresnel penumbra
nz                  = 64        # depth slices for the volumetric develop map
min_feature_nm      = 5000.0   # 5 µm minimum bar → aspect-ratio figure of merit
# develop_threshold_kj_cm3 = 3.0   # defaults to the bottom clearing dose
