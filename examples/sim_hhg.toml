# =============================================================================
# High-harmonic generation (HHG) — table-top coherent EUV at 13.5 nm
# =============================================================================
#
# An intense femtosecond driver focused into a noble gas emits odd harmonics of
# the driver frequency via the three-step model (tunnel ionization → field
# acceleration → recombination). The comb extends to the cutoff
#
#     E_max = I_p + 3.17 U_p ,   U_p[eV] = 9.33e-14 · I[W/cm²] · λ²[µm²]
#
# For an 800 nm driver at 4e14 W/cm² in neon (I_p = 21.565 eV):
#
#     U_p    = 9.33e-14 · 4e14 · 0.8²  = 23.9 eV
#     E_max  = 21.565 + 3.17 · 23.9    = 97.3 eV
#     q = 59 → E = 59 · (1239.84 / 800) = 91.4 eV  ≤ 97.3 eV  ✓ (inside cutoff)
#
# so the 59th harmonic (800/59 = 13.56 nm, the Mo/Si mirror band) is reachable.
# The constructor REJECTS even harmonics (inversion symmetry) and any harmonic
# above the cutoff, so this config doubles as a cutoff-law demonstration.
# Flux is low (nJ–µJ/pulse) but laser-coherent — the candidate compact source
# for actinic EUV mask inspection.
#
# Reference: Popmintchev et al., "Bright coherent ultrahigh harmonics in the
#            keV X-ray regime," Science 336, 1287 (2012).
#
# Run with:  highuvlith simulate --config examples/sim_hhg.toml
# -----------------------------------------------------------------------------

[source]
type                 = "hhg"
gas                  = "ne"       # neon (I_p = 21.565 eV)
driver_wavelength_nm = 800.0      # Ti:Sapphire
driver_intensity_w_cm2 = 4.0e14   # sets U_p and hence the cutoff
harmonic             = 59         # 800/59 = 13.56 nm; E = 91.4 eV ≤ 97.3 eV cutoff
monochromator_bandwidth_pm = 15.0 # single-harmonic imaging (honest for litho)

[optics]
# EUV has no refractive lens material — reflective Schwarzschild mirrors only.
type = "schwarzschild"
na   = 0.3

[mask]
cd_nm    = 30.0    # k1 = (pitch/2)·NA/λ = 15·0.3/13.56 ≈ 0.33
pitch_nm = 60.0

[grid]
size     = 128     # 128 × 2 nm = 256 nm field ≈ 4 pitches
pixel_nm = 2.0

[process]
dose_mj_cm2 = 30.0
focus_nm    = 0.0
